name: nutri_mind
description: "NutriMind AI"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.0
  google_sign_in: ^6.3.0
  nutrition_ai: ^3.3.0
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  chat_bubbles: ^1.10.1
  image_picker: ^1.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.jpg"